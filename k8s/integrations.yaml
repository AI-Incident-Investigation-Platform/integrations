apiVersion: apps/v1
kind: Deployment
metadata:
  name: integrations
spec:
  replicas: 2
  selector:
    matchLabels: {app: integrations}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  template:
    metadata:
      labels: {app: integrations}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: integrations
          image: aiip-integrations:latest
          ports:
            - name: http
              containerPort: 8007
          envFrom:
            - secretRef: {name: integrations}
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 160Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: integrations
spec:
  selector: {app: integrations}
  ports:
    - name: http
      port: 8007
      targetPort: http
