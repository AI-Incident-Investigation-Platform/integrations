[project]
name = "integrations"
version = "0.1.0"
description = "AIIP external integrations and telemetry explorer"
requires-python = ">=3.14"
dependencies = [
    "aiip-kit @ https://github.com/AI-Incident-Investigation-Platform/aiip-kit/archive/refs/tags/v0.1.0.tar.gz",
    "aio-pika>=9.5.0", "alembic>=1.20.0", "asyncpg>=0.32.0", "cryptography>=46.0.0",
    "fastapi>=0.143.3", "httpcore>=1.0,<2", "httpx>=0.28,<0.29",
    "pydantic-settings>=2.16.0",
    "sqlalchemy[asyncio]>=2.0,<2.1", "uvicorn>=0.54.0",
]

[dependency-groups]
dev = ["mypy>=2.4.0", "pytest>=9.1.1", "pytest-asyncio>=1.4.0", "ruff>=0.17.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py314"
include = ["src/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "C4", "UP", "SIM"]

[tool.mypy]
python_version = "3.14"
files = ["src", "tests"]
ignore_missing_imports = true
check_untyped_defs = true
